<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!--BRG_META-->
<title>brigada — доска</title>
<!--
  brigada board: the page of the human (DESIGN §9.1). Two modes, one file. As file://
  (no server) it only shows. Served by `brg board` with Python (bin/brg-serve.py), the
  server puts <meta name="brg-token"> in place of the BRG_META comment above — that
  turns on the control mode: writing to the brigade, answering questions, a new task,
  lead, pause, stop; every button is a POST to /api/<action> that runs brg as the human.
  `brg board` writes run/board/data.js (window.BRG_BOARD) and run/board/T00N.js
  (window.BRG_TASKS) next to this file; the page reloads data.js every 2 s with a
  classic script tag. The agent state words (DESIGN §5.2): "ждёт" = free, "работает ·
  подпись · N мин" = busy mark. Data go into the page only through textContent /
  createElement / safe attributes — never parsed as markup.
-->
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --sunken: #eef0f3; --fg: #1a2130; --muted: #5d6676; --faint: #8b93a2;
  --line: #e1e4ea; --line2: #d0d5dd; --accent: #2b6cd4; --accentbg: #e7effc;
  --ok: #1b7f47; --okbg: #e3f3e9; --warn: #995a00; --warnbg: #fcf1dc; --bad: #bf342e; --badbg: #fbe8e7;
  --rev: #6e46c6; --revbg: #efe9fb; --human: #c98500; --humanbg: #fff8e7; --humanline: #f0dcaa; --humanink: #8a5800;
  --code: #f2f4f7; --shadow: 0 1px 2px rgba(20, 28, 45, .06); --onacc: #ffffff;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
/* agent colors: --c fills the avatar and the stripe, --ct colors text */
.c0 { --c: #2b6cd4; --ct: #2560bd; } .c1 { --c: #0c8476; --ct: #0a7468; }
.c2 { --c: #7a4fd6; --ct: #6a40c4; } .c3 { --c: #c4510f; --ct: #ad470c; }
.c4 { --c: #2d8a3f; --ct: #257836; } .c5 { --c: #b8338c; --ct: #a32a7b; }
.c6 { --c: #6b7d12; --ct: #5b6b0c; } .c7 { --c: #cc3355; --ct: #b52a4a; }
.c8 { --c: #0a7ea8; --ct: #086e93; } .c9 { --c: #4f5a96; --ct: #444e86; }
.ch { --c: #e0a019; --ct: #9a6700; } .cs { --c: #9aa1ae; --ct: #6f7787; }
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --panel: #181b21; --sunken: #13151a; --fg: #e3e6eb; --muted: #9ba3b2; --faint: #6e7686;
    --line: #272c35; --line2: #343a46; --accent: #6ea0ff; --accentbg: #1a2740;
    --ok: #55c486; --okbg: #14291c; --warn: #e6aa48; --warnbg: #2d2410; --bad: #f2776f; --badbg: #351a1a;
    --rev: #b39fff; --revbg: #231d37; --human: #e8aa2c; --humanbg: #231e12; --humanline: #4c3d1b; --humanink: #f3c565;
    --code: #121419; --shadow: none; --onacc: #0b1428;
  }
  .c0 { --c: #3d7be3; --ct: #8db3ff; } .c1 { --c: #12968a; --ct: #5fd4c5; }
  .c2 { --c: #8a62e6; --ct: #bca5ff; } .c3 { --c: #d4621d; --ct: #ffa46e; }
  .c4 { --c: #36994a; --ct: #82da93; } .c5 { --c: #c8479b; --ct: #f592d1; }
  .c6 { --c: #7c921e; --ct: #c6d86d; } .c7 { --c: #d64463; --ct: #ff93a9; }
  .c8 { --c: #158fbb; --ct: #72cff1; } .c9 { --c: #6370b4; --ct: #aab3ea; }
  .ch { --c: #e8aa2c; --ct: #ffcf6e; } .cs { --c: #5d6575; --ct: #8f97a6; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
button, select, input { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.hide { display: none !important; }
.faint { color: var(--faint); }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }

/* top bar */
.top {
  position: -webkit-sticky; position: sticky; top: 0; z-index: 10;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  min-height: 52px; padding: 8px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
#proj { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand .sub { color: var(--faint); font-size: 12.5px; white-space: nowrap; }
#tasksel {
  max-width: 100%; min-width: 0; padding: 5px 8px; border-radius: 8px;
  background: var(--sunken); border: 1px solid var(--line); cursor: pointer;
}
.tsel { display: flex; flex: 0 1 auto; min-width: 0; max-width: 560px; }
.fresh { margin-left: auto; flex: none; width: 178px; justify-content: flex-end; overflow: hidden; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.fresh .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.fresh.stale .dot { background: var(--warn); }
.fresh.off .dot { background: var(--faint); }

/* banners */
#banners { max-width: 1720px; margin: 0 auto; padding: 0 20px; }
#banners:empty { display: none; }
.banner {
  margin-top: 12px; padding: 9px 14px; border-radius: 10px; font-size: 13.5px;
  background: var(--warnbg); border: 1px solid transparent; overflow-wrap: anywhere;
}
.banner b { margin-right: 4px; }
.banner.bad { background: var(--badbg); }
.banner.pause { background: var(--warnbg); border-color: var(--warn); }
.banner.pause b { color: var(--warn); letter-spacing: .04em; }
.banner.stop { background: var(--badbg); border-color: var(--bad); }
.banner.stop b { color: var(--bad); letter-spacing: .04em; }
.banner code { background: var(--panel); padding: 1px 6px; border-radius: 5px; }

/* layout: the task on the left, the chat on the right */
main {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 33%);
  grid-template-rows: auto auto auto auto auto auto 1fr;
  gap: 16px 20px; padding: 16px 20px 28px; max-width: 1720px; margin: 0 auto;
}
main > .sec { grid-column: 1; min-width: 0; align-self: start; }
#s-msgs { grid-column: 2; grid-row: 1 / span 7; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
h2 {
  display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px;
  font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
}
h2 .cnt { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--faint); }
.sec.mini { display: flex; align-items: baseline; gap: 8px; padding: 0 4px; font-size: 13px; }
.sec.mini .mt { font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.empty { color: var(--muted); }

/* pills, chips, avatars */
.pill {
  display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; line-height: 18px;
  white-space: nowrap; background: var(--sunken); color: var(--muted); vertical-align: middle;
}
.pill.ok { background: var(--okbg); color: var(--ok); }
.pill.warn { background: var(--warnbg); color: var(--warn); }
.pill.bad { background: var(--badbg); color: var(--bad); }
.pill.rev { background: var(--revbg); color: var(--rev); }
.pill.acc { background: var(--accentbg); color: var(--accent); }
.pill.wrap { white-space: normal; }
.av {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: #fff;
  font-size: 10px; font-weight: 700; letter-spacing: -.02em; line-height: 1; vertical-align: middle;
}
.ch .av, .av.ch { color: #2b1d00; }
.av.xs { width: 18px; height: 18px; font-size: 8.5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; vertical-align: middle; }
.chip .nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.sm .av { width: 20px; height: 20px; font-size: 9px; }
.chip.sm .nm { font-size: 12.5px; }
.lnk { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
.lnk:hover { text-decoration: underline; }
.pill.hum { background: var(--humanbg); color: var(--humanink); box-shadow: inset 0 0 0 1px var(--humanline); }
button.pill { border: 0; cursor: pointer; font-family: inherit; }
button.pill:hover { text-decoration: underline; }

/* questions to the human (DESIGN §9.2) */
.panel.asks { background: var(--humanbg); border-color: var(--humanline); box-shadow: inset 4px 0 0 var(--human), var(--shadow); }
.asks h2 { color: var(--humanink); }
.asks h2 .cnt { color: var(--humanink); font-weight: 650; }
.ask + .ask { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--humanline); }
.ask .ah { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
.ask .askb { margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; line-height: 1.5; font-size: 14px; }
.ask .askb.clip { max-height: 4.5em; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent); mask-image: linear-gradient(to bottom, #000 60%, transparent); }
.ask .where { margin-top: 6px; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.ask .where code { background: var(--panel); padding: 1px 6px; border-radius: 5px; color: var(--fg); }

/* task */
.thead { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px 16px; }
.ttitle { flex: 1 1 320px; min-width: 0; margin: 0; font-size: 20px; line-height: 1.3; font-weight: 650; overflow-wrap: anywhere; }
.ttitle .tid { color: var(--faint); font-weight: 600; margin-right: 6px; }
.tstat { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; padding-top: 3px; }
.pill.ts-active { background: var(--accentbg); color: var(--accent); }
.pill.ts-done { background: var(--okbg); color: var(--ok); }
.pill.ts-cancelled { background: var(--sunken); color: var(--muted); }
.troles { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 10px; font-size: 13px; }
.troles .lab { color: var(--faint); font-size: 12px; margin-right: 6px; }
.past { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); }
.tfin { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); }
.tfin b { color: var(--ok); font-weight: 650; }
.prog { margin-top: 14px; }
.bar { display: flex; height: 8px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.bar .seg { height: 100%; }
.seg.done { background: var(--ok); } .seg.review { background: var(--rev); } .seg.work { background: var(--accent); }
.plab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.plab b { color: var(--fg); font-weight: 600; }
.lg::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--faint); vertical-align: 0; }
.lg.review::before { background: var(--rev); } .lg.work::before { background: var(--accent); } .lg.todo::before { background: var(--line2); }

/* brigade */
.strip { display: flex; flex-wrap: wrap; gap: 8px; }
.achip {
  display: flex; align-items: center; gap: 9px; min-width: 0; max-width: 100%;
  padding: 6px 14px 6px 7px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
}
.achip.dim { opacity: .55; }
.achip.gone-n { padding: 6px 14px; font-size: 12.5px; color: var(--muted); cursor: default; }
.achip.drop { background: var(--warnbg); border-color: var(--warn); }
.avw { position: relative; flex: none; }
.avw .av { width: 30px; height: 30px; font-size: 11px; }
.sdot { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--panel); background: var(--faint); }
.achip.drop .sdot { border-color: var(--warnbg); }
.s-waiting .sdot { background: var(--faint); }
.achip.w-work .sdot { background: var(--c); }
.achip.w-work .l2 .wk { color: var(--ct); font-weight: 650; }
.s-asleep .sdot { background: var(--warn); }
.s-gone .sdot { background: var(--panel); box-shadow: inset 0 0 0 2px var(--faint); }
.ab { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.ab .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ab .l1 .nm { font-weight: 650; font-size: 13.5px; white-space: nowrap; }
.ab .l2 { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab .l2 .doing { color: var(--fg); font-weight: 600; }
.ab .l2 .fixing { color: var(--bad); font-weight: 600; }
.ab .l2 .revw { color: var(--rev); font-weight: 600; }
.role { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 5px; border-radius: 5px; background: var(--sunken); color: var(--muted); }
.role.stop { background: var(--badbg); color: var(--bad); }
.role.pause { background: var(--warnbg); color: var(--warn); }
.role.ask { background: var(--humanbg); color: var(--humanink); box-shadow: inset 0 0 0 1px var(--humanline); text-transform: none; letter-spacing: 0; font-size: 11px; }
.achip.asking { border-color: var(--human); }
.kp { font-family: var(--mono); font-size: 10.5px; color: var(--faint); cursor: help; }
.warns { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.wline { padding: 7px 12px; border-radius: 10px; background: var(--warnbg); color: var(--fg); font-size: 13px; overflow-wrap: anywhere; }
.wline b { color: var(--warn); }
/* agents launched by brg (DESIGN §5.5) */
.role.spawn { background: var(--sunken); color: var(--muted); }
.spawnp { margin-top: 8px; border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line2)); border-radius: 10px; background: var(--panel); }
.spawnp > summary { padding: 6px 10px; font-size: 12.5px; cursor: pointer; overflow-wrap: anywhere; }
.spb { padding: 4px 12px 10px; font-size: 12.5px; }
.spact { margin-top: 6px; max-height: 260px; overflow: auto; font-size: 12px; }
.spl { white-space: pre-wrap; overflow-wrap: anywhere; }
.spl .st, .spl .sk { color: var(--faint); }
.spl.turn { margin-top: 4px; padding-top: 3px; border-top: 1px solid var(--line); font-weight: 650; }
.spt { margin-top: 2px; padding: 6px 8px; border-radius: 8px; background: var(--sunken); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 200px; overflow: auto; font-size: 12px; }
.spawnp .bad, .spl.bad { color: var(--bad); }
.spawnp .wk { color: var(--ct, var(--fg)); font-weight: 600; }
.spperm { margin-top: 6px; }
.dlg label.radio { display: block; margin-top: 4px; font-size: 12.5px; color: var(--fg); }

/* kanban */
.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kanban.k5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.kcol { background: var(--sunken); border-radius: 12px; padding: 8px; min-width: 0; }
.kcol h3 { display: flex; align-items: center; gap: 7px; margin: 2px 4px 8px; font-size: 12.5px; font-weight: 650; color: var(--fg); }
.kcol h3 .kd { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.kcol h3 .n { margin-left: auto; color: var(--faint); font-weight: 500; }
.k-work h3 .kd { background: var(--accent); } .k-review h3 .kd { background: var(--rev); }
.k-done h3 .kd { background: var(--ok); } .k-cancelled h3 .kd { background: var(--line2); }
.kempty { color: var(--faint); font-size: 12.5px; padding: 2px 6px 6px; }
.card {
  position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 11px 10px; margin-bottom: 8px; box-shadow: var(--shadow); overflow-wrap: anywhere; min-width: 0;
}
.card:last-child { margin-bottom: 0; }
.card.fix { box-shadow: inset 3px 0 0 var(--bad), var(--shadow); }
.card.st-cancelled { opacity: .6; }
.crow { display: flex; align-items: center; gap: 6px; }
.card .num { font-family: var(--mono); font-size: 11px; color: var(--faint); font-weight: 600; }
.vmark { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; font-size: 11px; font-weight: 700; }
.vmark.ok { background: var(--okbg); color: var(--ok); }
.vmark.bad { background: var(--badbg); color: var(--bad); }
.card .ttl { margin: 2px 0 7px; font-size: 14px; line-height: 1.35; font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
.tags .pill { white-space: normal; }
.revline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: 7px; font-size: 12px; color: var(--rev); }
.revline.wait { color: var(--faint); }
.why { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; margin: -2px 0 7px; font-size: 12px; color: var(--muted); }
.cfoot { display: flex; align-items: center; gap: 8px; justify-content: space-between; min-width: 0; }
.cfoot .chip { flex: 0 1 auto; }
.cfoot .tm { flex: none; font-size: 12px; color: var(--faint); white-space: nowrap; }
.cfoot .tm.live { color: var(--muted); }
.acc-by { display: inline-flex; align-items: center; gap: 4px; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.more > summary { margin-top: 7px; font-size: 12px; color: var(--faint); }
.more > summary::before, .run > summary::before, .sys > summary::before { content: "▸"; display: inline-block; width: 1em; color: var(--faint); }
.more[open] > summary::before, .run[open] > summary::before, .sys[open] > summary::before { content: "▾"; }
.dbody { margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--line2); font-size: 12.5px; display: flex; flex-direction: column; gap: 6px; }
.dbody .k { color: var(--faint); margin-right: 4px; }
.rvw { padding: 6px 8px; border-radius: 8px; background: var(--sunken); }
.rvw .rh { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--muted); }
.rvw .pre { margin-top: 4px; }
.rvw.skip { background: transparent; border: 1px dashed var(--line2); }

/* runs */
.runs { display: flex; flex-direction: column; }
.run { border-top: 1px solid var(--line); }
.run:first-child { border-top: 0; }
.run > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 7px 2px; }
.run .rid { font-weight: 600; color: var(--muted); }
.run .cmd { flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rmeta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); white-space: nowrap; }
.tag { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.rbody { padding: 0 2px 10px 18px; font-size: 12.5px; }
pre {
  white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; padding: 8px 10px; background: var(--code);
  border: 1px solid var(--line); border-radius: 8px; max-height: 360px; overflow: auto; font-family: var(--mono); font-size: 12px;
}

/* docs, tasks */
.dhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 10px; }
.dhead h2 { margin: 0; }
.seg2 { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border-radius: 9px; background: var(--sunken); }
.seg2 button { border: 0; background: transparent; padding: 3px 11px; border-radius: 7px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.seg2 button.on { background: var(--panel); color: var(--fg); font-weight: 600; box-shadow: var(--shadow); }
.seg2 button.off { color: var(--faint); }
.doc { max-height: 60vh; overflow: auto; font-size: 13.5px; line-height: 1.55; }
.trow {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; width: 100%; padding: 7px 8px;
  border: 0; border-radius: 9px; background: transparent; text-align: left; cursor: pointer;
}
.trow:hover { background: var(--sunken); }
.trow.sel { background: var(--accentbg); }
.trow .tid { font-family: var(--mono); font-size: 12px; color: var(--faint); font-weight: 600; }
.trow .tt { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.trow .sum { flex-basis: 100%; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }

/* chat */
.msgpane {
  position: -webkit-sticky; position: sticky; top: 68px; height: calc(100vh - 84px); min-height: 360px;
  display: flex; flex-direction: column; padding: 0; overflow: hidden;
}
.mphead { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.mphead h2 { margin-bottom: 8px; }
.mctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.mctl label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.mctl select { padding: 2px 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); max-width: 160px; }
#msgtrunc { margin-top: 6px; font-size: 12px; color: var(--faint); }
#msgtrunc:empty { display: none; }
#msglist { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 12px; background: var(--sunken); }
.msg {
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 10px;
  padding: 8px 12px 10px; margin-bottom: 10px; box-shadow: var(--shadow); overflow-wrap: anywhere; min-width: 0;
}
.msg.human { background: var(--humanbg); border-color: var(--humanline); border-left-color: var(--human); }
.msg.flash, .sys.flash { outline: 2px solid var(--accent); outline-offset: 1px; }
.mh { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; font-size: 12.5px; color: var(--muted); }
.mh .to { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0 4px; min-width: 0; }
.mh .rn { color: var(--ct); font-weight: 600; }
.mh .all { color: var(--muted); }
.mh .when { margin-left: auto; font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.quote {
  display: block; width: 100%; margin-top: 6px; padding: 3px 8px; border: 0; border-left: 2px solid var(--line2);
  border-radius: 0 6px 6px 0; background: var(--sunken); font-size: 12px; color: var(--muted); text-align: left; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.quote:hover { color: var(--fg); }
.quote .qn { color: var(--accent); margin-right: 4px; }
.mb { margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; line-height: 1.55; font-size: 13.5px; }
.mb.clip { max-height: 18.6em; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent); mask-image: linear-gradient(to bottom, #000 72%, transparent); }
.mexp { margin-top: 4px; font-size: 12.5px; }
.sys { margin: -2px 0 8px; padding: 0 4px; font-size: 12px; color: var(--faint); line-height: 1.45; overflow-wrap: anywhere; }
.sys > summary { display: block; }
.sys > div:first-child::before { content: ""; display: inline-block; width: 1em; }
.sys .sw { font-weight: 600; color: var(--ct); }
.sys .st { color: var(--faint); }
.sys .sb { margin: 4px 0 2px 1em; padding: 6px 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap; font-size: 12px; color: var(--muted); }


/* control mode: buttons, composer, agent menu, dialogs (only served by brg board with Python) */
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.cbtn {
  border: 1px solid var(--line2); background: var(--panel); color: var(--fg); border-radius: 8px;
  padding: 4px 11px; font-size: 12.5px; line-height: 1.4; cursor: pointer; white-space: nowrap;
}
.cbtn:hover { background: var(--sunken); }
.cbtn.pri { background: var(--accent); border-color: var(--accent); color: var(--onacc); font-weight: 600; }
.cbtn.pri:hover { filter: brightness(1.08); }
.cbtn.danger { color: var(--bad); border-color: var(--bad); }
.cbtn.danger.fill { background: var(--bad); color: #fff; }
.cbtn:disabled { opacity: .5; cursor: default; }
.composer { flex: none; padding: 10px 12px 12px; background: var(--panel); border-top: 1px solid var(--line); }
.cmp-to { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
.tchip {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 1px 9px 1px 3px; border-radius: 999px;
  border: 1px solid var(--line2); background: var(--panel); font-size: 12px; cursor: pointer;
}
.tchip.all { padding-left: 9px; }
.tchip .av { width: 18px; height: 18px; font-size: 8.5px; }
.tchip.on { border-color: var(--c, var(--accent)); background: var(--accentbg); font-weight: 600; }
.tchip.all.on { border-color: var(--accent); }
.cmp-re { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; padding: 4px 8px; border-radius: 8px; background: var(--sunken); font-size: 12px; color: var(--muted); }
.cmp-re .rt { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.composer textarea, .dlg textarea, .dlg input[type="text"] {
  display: block; width: 100%; padding: 8px 10px; border: 1px solid var(--line2); border-radius: 9px; background: var(--bg);
  line-height: 1.45; resize: vertical;
}
.composer textarea { min-height: 58px; max-height: 40vh; }
.composer textarea:focus, .dlg textarea:focus, .dlg input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.cmp-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 6px; }
.cmp-foot label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.cmp-foot select { padding: 2px 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); max-width: 150px; }
.cmp-st { flex: 1 1 120px; min-width: 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.cmp-st.ok { color: var(--ok); } .cmp-st.bad { color: var(--bad); }
.achip { position: relative; }
.kebab {
  flex: none; align-self: flex-start; margin: -3px -9px 0 0; padding: 2px 7px; border: 0; border-radius: 7px;
  background: transparent; color: var(--faint); font-size: 16px; line-height: 1.2; cursor: pointer;
}
.kebab:hover { background: var(--sunken); color: var(--fg); }
.menu {
  position: absolute; right: 6px; top: calc(100% - 4px); z-index: 20; min-width: 180px; padding: 4px;
  background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 8px 26px rgba(0, 0, 0, .25);
}
.menu button { display: block; width: 100%; padding: 6px 10px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: 13px; cursor: pointer; }
.menu button:hover { background: var(--sunken); }
.menu button.danger { color: var(--bad); }
.ovl { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 14, 22, .55); }
.dlg { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; box-shadow: 0 14px 44px rgba(0, 0, 0, .4); }
.dlg h3 { margin: 0 0 8px; font-size: 16px; }
.dlg label { display: block; margin-top: 10px; margin-bottom: 3px; font-size: 12px; color: var(--muted); }
.dlg .note { margin-top: 8px; padding: 7px 10px; border-radius: 8px; background: var(--warnbg); font-size: 13px; }
.dlg .acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.dlg .err { margin-top: 8px; color: var(--bad); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.toast {
  position: fixed; left: 50%; bottom: 18px; z-index: 60; transform: translateX(-50%); max-width: min(640px, calc(100vw - 24px));
  padding: 9px 14px; border-radius: 10px; background: var(--fg); color: var(--bg); font-size: 13px; box-shadow: 0 8px 26px rgba(0, 0, 0, .3);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.toast.bad { background: var(--bad); color: #fff; }
.ask .acts2 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; }
.mh .reply { font-size: 11.5px; }

@media (max-width: 1240px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
  #s-msgs { grid-column: 1; grid-row: auto; }
  #s-asks { order: 0; } #s-task { order: 1; } #s-agents { order: 2; } #s-kanban { order: 3; } #s-msgs { order: 4; }
  #s-runs { order: 5; } #s-docs { order: 6; } #s-tasks { order: 7; }
  .msgpane { position: static; height: auto; min-height: 0; }
  #msglist { max-height: 75vh; }
}
@media (max-width: 680px) {
  .top { position: static; padding: 8px 12px; }
  main { padding: 12px 12px 24px; gap: 12px; }
  #banners { padding: 0 12px; }
  .kanban, .kanban.k5 { grid-template-columns: minmax(0, 1fr); }
  .fresh { margin-left: 0; width: auto; justify-content: flex-start; }
  .ttitle { font-size: 18px; }
}
@media (prefers-reduced-motion: no-preference) {
  .achip.w-work .sdot { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span id="proj">brigada</span><span class="sub">доска бригады</span></div>
  <label class="tsel"><span class="sr">Задача</span><select id="tasksel" aria-label="Задача"></select></label>
  <div id="ctl" class="ctl hide"></div>
  <div id="fresh" class="fresh off"></div>
</header>
<div id="banners"></div>
<main>
  <section id="s-asks" class="sec hide"></section>
  <section id="s-task" class="sec hide"></section>
  <section id="s-agents" class="sec hide"></section>
  <section id="s-kanban" class="sec hide"></section>
  <section id="s-msgs">
    <div class="panel msgpane">
      <div class="mphead">
        <h2>Переписка</h2>
        <div class="mctl">
          <div class="seg2" id="msgtabs"></div>
          <label>агент <select id="magent"></select></label>
          <label><input type="checkbox" id="msys"> скрыть системные</label>
        </div>
        <div id="msgtrunc"></div>
      </div>
      <div id="msglist"></div>
      <div id="composer" class="composer hide">
        <div class="cmp-to" id="cmpto"></div>
        <div class="cmp-re hide" id="cmpre"></div>
        <textarea id="cmptext" rows="3" placeholder="Написать бригаде… (Ctrl/⌘+Enter — отправить)" aria-label="Сообщение бригаде"></textarea>
        <div class="cmp-foot">
          <label>канал <select id="cmpchan"></select></label>
          <span id="cmpst" class="cmp-st"></span>
          <button type="button" class="cbtn pri" id="cmpsend">Отправить</button>
        </div>
      </div>
    </div>
  </section>
  <section id="s-runs" class="sec hide"></section>
  <section id="s-docs" class="sec hide"></section>
  <section id="s-tasks" class="sec hide"></section>
</main>
<div id="toast" class="toast hide" role="status"></div>
<script>
(function () {
  "use strict";
  var REFRESH = 2000;
  var STATE_RU = { waiting: "ждёт", working: "работает", asleep: "спит", gone: "ушёл" };
  var TASK_RU = { active: "идёт", done: "закрыта", cancelled: "отменена" };
  var RUN_RU = { queued: "в очереди", running: "идёт", done: "готово", failed: "ошибка", timeout: "таймаут", killed: "остановлен", cancelled: "отменён" };
  var RUN_FINAL = { done: 1, failed: 1, timeout: 1, killed: 1, cancelled: 1 };
  var DOCS = [["brief", "Постановка", "постановки нет"], ["plan", "План", "плана нет — его пишет lead в shared/plan.md задачи"], ["summary", "Итог", "итога ещё нет — summary.md нужен для закрытия задачи"]];
  var RUN_CMD = "bash .brigada/bin/brg board (Windows: .\\.brigada\\bin\\brg.cmd board)";
  var PAL = 10, CLIP_LINES = 12, CLIP_CHARS = 1200, QUOTE = 80;

  var S = {
    data: null, err: "", sel: "", msgTab: "task", agent: "", hideSys: false, docTab: "",
    open: {}, last: {}, tload: {}, msgChan: "", colors: {}, csig: "", idleSince: 0,
    to: [], re: null, sendChan: "", menu: "", modal: null, act: "", actTitle: "", spScroll: {}, spLists: []
  };
  // the control mode (DESIGN §9.1): the server put the token in the page; as file:// there is none
  var TOKEN = (function () {
    var m = document.querySelector('meta[name="brg-token"]');
    return m ? m.getAttribute("content") || "" : "";
  })();
  var CTL = !!TOKEN && /^https?:$/.test(location.protocol);

  // ── helpers ──
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }
  function add(p) {
    for (var i = 1; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      p.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
    }
    return p;
  }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }
  function hv(r, k) { return r && r.h && typeof r.h[k] === "string" ? r.h[k] : ""; }
  function num(s) { return /^\d+$/.test(String(s)) ? parseInt(s, 10) : 0; }
  function now() { return Math.floor(Date.now() / 1000); }
  function dur(s) {
    s = Math.max(0, Math.floor(s));
    if (s < 60) return s + " с";
    if (s < 3600) return Math.floor(s / 60) + " мин";
    if (s < 86400) return Math.floor(s / 3600) + " ч" + (Math.floor(s / 60) % 60 ? " " + Math.floor(s / 60) % 60 + " мин" : "");
    return Math.floor(s / 86400) + " д" + (Math.floor(s / 3600) % 24 ? " " + Math.floor(s / 3600) % 24 + " ч" : "");
  }
  function ago(s) {
    s = Math.max(0, Math.floor(s));
    if (s < 120) return s + " с назад";
    if (s < 7200) return Math.floor(s / 60) + " мин назад";
    return Math.floor(s / 3600) + " ч назад";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function hm(ep) {
    if (!ep) return "";
    var d = new Date(ep * 1000), s = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (d.toDateString() !== new Date().toDateString()) s = pad(d.getDate()) + "." + pad(d.getMonth() + 1) + " " + s;
    return s;
  }
  function isoEpoch(s) { var t = Date.parse(s); return isNaN(t) ? 0 : Math.floor(t / 1000); }
  function names(s) { return String(s || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean); }
  function natcmp(a, b) {
    var ra = /^(.*?)(\d+)$/.exec(a), rb = /^(.*?)(\d+)$/.exec(b);
    if (ra && rb && ra[1] === rb[1]) return parseInt(ra[2], 10) - parseInt(rb[2], 10);
    return a < b ? -1 : a > b ? 1 : 0;
  }
  function taskId(t) { var m = /^(T\d{3,6})(-|$)/.exec(t && typeof t.dir === "string" ? t.dir : ""); return m ? m[1] : ""; }
  function firstLine(s, max) {
    var ls = String(s || "").split("\n"), i, x = "";
    for (i = 0; i < ls.length; i++) { x = ls[i].replace(/^\s+|\s+$/g, ""); if (x) break; }
    return x.length > max ? x.slice(0, max - 1) + "…" : x;
  }
  // a span kept current by tick(): "ago" (… назад) or "dur" (… мин) since an epoch
  function live(fmt, since, cls) {
    var e = el("span", "live" + (cls ? " " + cls : ""));
    e.setAttribute("data-fmt", fmt);
    e.setAttribute("data-since", String(since));
    e.textContent = fmt === "ago" ? ago(now() - since) : dur(now() - since);
    return e;
  }
  function pill(text, cls) { return el("span", "pill" + (cls ? " " + cls : ""), text); }
  function btn(cls, text, fn) {
    var b = el("button", cls, text);
    b.type = "button";
    b.addEventListener("click", fn);
    return b;
  }
  // <details> keeps its open state across re-renders
  function details(key, cls) {
    var d = el("details", cls);
    d.open = !!S.open[key];
    d.addEventListener("toggle", function () { S.open[key] = d.open; });
    return d;
  }
  function sec(name, input, fn) {
    var k = JSON.stringify(input);
    if (S.last[name] === k) return;
    S.last[name] = k;
    fn(input);
  }
  function head(box, title, cnt) {
    var h = el("h2", null, title);
    if (cnt) h.appendChild(el("span", "cnt", cnt));
    box.appendChild(h);
    return h;
  }
  // an empty section: one short line instead of a panel
  function mini(box, title, text) {
    box.className = "sec mini";
    add(box, el("span", "mt", title), el("span", "faint", text));
  }


  // ── control mode: actions are POSTs to the server of `brg board`; it runs brg as the human ──
  function api(action, body, done) {
    var x = new XMLHttpRequest();
    x.open("POST", "/api/" + action);
    x.setRequestHeader("Content-Type", "application/json");
    x.setRequestHeader("X-Brg-Token", TOKEN);
    x.onload = function () {
      var r = null;
      try { r = JSON.parse(x.responseText); } catch (e) { r = null; }
      if (!r || typeof r !== "object") r = { ok: false, out: x.status === 403 ? "доступ закрыт (токен или cookie) — открой адрес из вывода brg board" : "ответ сервера не разобран (" + x.status + ")" };
      setTimeout(load, 300);
      setTimeout(load, 1000);
      done(r);
    };
    x.onerror = function () { done({ ok: false, out: "сервер доски недоступен — он остановлен? Запусти brg board" }); };
    x.send(JSON.stringify(body || {}));
  }
  // the first lines of brg's answer, without the «── » marks
  function brief(out) {
    return String(out || "").split("\n").filter(Boolean).slice(0, 3).map(function (l) {
      l = l.replace(/^── /, "");
      return l.length > 160 ? l.slice(0, 159) + "…" : l;
    }).join("\n");
  }
  // the first line only (hints for the terminal, long paths — in the tooltip)
  function first(out) { return brief(String(out || "").split("\n").filter(Boolean).slice(0, 1).join("\n")); }
  var toastT = 0;
  function toast(text, bad, full) {
    var t = $("toast");
    t.textContent = text;
    t.title = full || "";
    t.className = "toast" + (bad ? " bad" : "");
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.className = "toast hide"; }, bad ? 10000 : 5000);
  }
  function act(action, body) {
    api(action, body, function (r) { toast((r.ok ? first(r.out) : brief(r.out)) || (r.ok ? "готово" : "ошибка"), !r.ok, r.out); });
  }
  function closeModal() {
    if (S.modal && S.modal.parentNode) S.modal.parentNode.removeChild(S.modal);
    S.modal = null;
  }
  function modal(build) {
    closeModal();
    var o = el("div", "ovl"), d = el("div", "dlg");
    d.setAttribute("role", "dialog");
    d.setAttribute("aria-modal", "true");
    o.addEventListener("mousedown", function (e) { if (e.target === o) closeModal(); });
    o.appendChild(d);
    document.body.appendChild(o);
    S.modal = o;
    build(d);
  }
  // a dangerous action asks first; the button says what it does
  function confirmBox(title, text, label, fn) {
    modal(function (d) {
      var no = btn("cbtn", "Не надо", closeModal);
      d.appendChild(el("h3", null, title));
      d.appendChild(el("div", "pre", text));
      d.appendChild(add(el("div", "acts"), no, btn("cbtn danger fill", label, function () { closeModal(); fn(); })));
      no.focus();
    });
  }
  function newTaskBox() {
    modal(function (d) {
      var ti = el("input"), br = el("textarea"), err = el("div", "err hide"), go;
      ti.type = "text";
      ti.maxLength = 200;
      ti.placeholder = "коротко, о чём задача (одна строка)";
      br.rows = 9;
      br.placeholder = "Постановка — что нужно сделать, дословно. Бригада прочитает её как есть.";
      d.appendChild(el("h3", null, "Новая задача"));
      if (S.act) d.appendChild(el("div", "note", "Сейчас идёт " + S.act + " «" + S.actTitle + "». Новая задача отменит её: работа агентов по ней прекратится."));
      d.appendChild(add(el("label", null, "Заголовок"), ti));
      d.appendChild(add(el("label", null, "Постановка"), br));
      d.appendChild(err);
      go = btn("cbtn pri", S.act ? "Отменить " + S.act + " и создать" : "Создать задачу", function () {
        var t = ti.value.replace(/^\s+|\s+$/g, ""), b = br.value;
        function bad(m) { err.textContent = m; err.className = "err"; }
        if (!t) { bad("Нужен заголовок."); ti.focus(); return; }
        if (!b.replace(/\s+/g, "")) { bad("Нужна постановка."); br.focus(); return; }
        go.disabled = true;
        api("task-new", { title: t, brief: b, cancel_current: !!S.act }, function (r) {
          go.disabled = false;
          if (r.ok) { closeModal(); toast(first(r.out), false, r.out); } else bad(brief(r.out) || "ошибка");
        });
      });
      d.appendChild(add(el("div", "acts"), btn("cbtn", "Отмена", closeModal), go));
      ti.focus();
    });
  }
  // the toolbar of the page: whole-brigade actions
  function renderCtl(v) {
    var box = $("ctl");
    clear(box);
    if (!CTL) { box.className = "ctl hide"; return; }
    box.className = "ctl";
    box.appendChild(btn("cbtn pri", "Новая задача", newTaskBox));

      }),
      last: null

  // DESIGN §7.1.1 — the stage, the same rule as brg's item_stage_v. col: todo | work |
  // review | done | cancelled | other. The newest verdict: changes — special, skip —
  // «готово · без проверки», anything else (ok, odd values) — «готово». fix — changes
  // (claimed: «правки по ревью»; done: «правки», shown in the work column); again —
  // handed in again after changes; noReview — without review (plan — by Review: no)
  function stageOf(it) {

    var s = { col: "other", fix: false, again: false, after: false, noReview: false, plan: false, last: last };

    else if (it.status === "cancelled") s.col = "cancelled";
    else if (it.status === "claimed") { s.col = "work"; s.fix = v === "changes"; }
    else if (it.status === "done") {
      if (n > 0) { // n > d: a verdict after the hand-in; 0 < n ≤ d: handed in after it
        if (v === "changes") { if (n > d) { s.col = "work"; s.fix = true; } else { s.col = "review"; s.again = true; } }
        else if (v === "skip") { s.col = "done"; s.noReview = true; }
        else if (n > d) s.col = "done";
        else { s.col = "review"; s.after = true; } // handed in after ok: the work may have changed
      } else if (it.reviewFlag === "no") { s.col = "done"; s.noReview = true; s.plan = true; }
      else s.col = "review";
      // someone is reviewing — the review is going on («передумали, проверка нужна»)

    var cur = d && d.current, curId = cur ? cur.id : "";
    var agents = ((d && d.agents) || []).map(function (a) {
      return { name: a.name, harness: hv(a, "Harness"), model: hv(a, "Model"), state: a.state, seen: a.seen || 0,
        note: a.note || "", drop: !!a.drop, stopped: !!a.stopped, paused: !!a.paused, joined: num(hv(a, "Joined-Epoch")),
        kp: typeof a.kp === "string" ? a.kp : "",
        spawn: spawnOf(a.spawn), // launched by brg (DESIGN §5.5), else null
        halt: (a.state === "waiting" || a.state === "working") && (!!a.stopped || !!meta.stop), // the human's stop ended its turn
        mark: a.mark && typeof a.mark === "object" ? { note: typeof a.mark.note === "string" ? a.mark.note : "", since: num(a.mark.since), via: a.mark.via || "", item: a.mark.item || "" } : null };
    }).sort(function (a, b) { return (a.state === "gone") - (b.state === "gone") || natcmp(a.name, b.name); });
    setColors(agents);
    var cs = S.csig;
    var th = t && t.task ? t.task.h : null;
    var closed = !!th && th.Status !== "active";
    var isLive = !!(v && v.isCur && th && th.Status === "active");
    var items = t ? (t.items || []).filter(Boolean).map(itemOf) : [];
    var runs = t ? (t.runs || []).filter(Boolean).map(runOf) : [];

    sec("head", { project: meta.project, tasks: tasks.map(function (x) { return [x.id, x.title, x.status]; }), curId: curId, sel: S.sel }, renderHead);
    sec("fresh", { hasData: !!d, stale: stale, time: meta.time || 0, version: meta.version || "", interval: interval }, renderFresh);

    // open questions to the human (DESIGN §9.2): "asks" of the snapshot; an older brg has none
    var cth = cur && cur.task ? cur.task.h : null, cActive = !!cth && cth.Status === "active";
    S.act = cActive ? curId : "";
    S.actTitle = cActive ? cth.Title || "" : "";
    // another current task (a new one, a switch): the recipient, the channel, the reply and the status are the old task's
    var taskKey = curId + ":" + (cActive ? 1 : 0);
    if (S.taskKey !== undefined && S.taskKey !== taskKey && CTL) { S.to = []; S.re = null; S.sendChan = ""; cmpStatus("", false); }
    S.taskKey = taskKey;
    var hasAsks = !!d && Array.isArray(d.asks), asking = {}, kps = {};
    var asks = (hasAsks ? d.asks : []).filter(function (x) { return x && x.h && num(hv(x, "Id")); }).map(function (x) {
      return { id: num(hv(x, "Id")), chan: typeof x.chan === "string" && x.chan ? x.chan : hv(x, "Channel"), from: hv(x, "From"),
        epoch: num(hv(x, "Epoch")), b: x.b || "" };
    }).sort(function (a, b) { return (a.epoch - b.epoch) || (a.id - b.id); });
    asks.forEach(function (q) { (asking[q.from] = asking[q.from] || []).push("#" + q.id); });
    agents.forEach(function (a) { if (a.kp) kps[a.name] = a.kp; });
    document.title = (asks.length ? "(" + asks.length + ") " : "") + (meta.project ? meta.project + " — " : "") + "brigada";
    sec("asks", { asks: asks, kp: kps, defChan: cActive ? curId : "lobby", vid: tid, curId: curId, cs: cs }, renderAsks);

    // "the brigade idles": a live wait, nobody working, no open questions or runs, the task active.
    // How long: the longer of what this page has seen and the time since the task's last message.
    var idleFrom = 0, anyFree = false, anyWork = false;
    var cRuns = (cur && cur.runs || []).filter(Boolean).map(runOf);
    agents.forEach(function (a) { if (isWorking(a)) anyWork = true; else if (a.state === "waiting") anyFree = true; });
    if (d && cActive && !stale && !meta.stop && !meta.pause && anyFree && !anyWork && !asks.length && !cRuns.some(function (r) { return !RUN_FINAL[r.status]; })) {
      if (!S.idleSince) S.idleSince = now();
      var lastMsg = 0;
      (cur.messages || []).forEach(function (m) { lastMsg = Math.max(lastMsg, num(hv(m, "Epoch"))); });
      idleFrom = lastMsg ? Math.min(S.idleSince, lastMsg) : S.idleSince;
      if (now() - idleFrom <= 120) idleFrom = 0;
    } else S.idleSince = 0;
    sec("banners", { hasData: !!d, err: S.err, stale: stale, time: meta.time || 0, stop: !!meta.stop, stopped: meta.stopped || [],
      pause: !!meta.pause, paused: agents.filter(function (a) { return a.paused; }).map(function (a) { return a.name; }), idle: idleFrom }, renderBanners);

    var counts = { todo: 0, work: 0, review: 0, done: 0, cancelled: 0, other: 0 };
    items.forEach(function (i) { counts[i.st.col]++; });
    // every item final, the task live: what the lead does now («подзадачи готовы · lead X …», DESIGN §9.1)
    var fin = null;
    if (isLive && items.length && items.every(function (i) { return i.st.col === "done" || i.st.col === "cancelled"; })) {
      var ln = th.Lead || "", la = agents.filter(function (a) { return a.name === ln; })[0];
      fin = { lead: ln, state: la ? la.state : "", mark: la ? la.mark : null, off: la ? offline(la) : "" };
    }
    // the tokens of the agents launched by brg (DESIGN §5.5): their sum in the task's head
    var ssum = { n: 0, tin: 0, tout: 0, cost: 0, stream: false };
    agents.forEach(function (a) { if (a.spawn) { ssum.n++; ssum.tin += a.spawn.tin; ssum.tout += a.spawn.tout; ssum.cost += a.spawn.cost; if (a.spawn.src !== "export") ssum.stream = true; } });
    sec("task", { ssum: ssum, th: th, vid: tid, isCur: v ? v.isCur : true, missing: v ? v.missing || "" : "", hasData: !!d,
      counts: counts, closed: closed, fin: fin, cs: cs }, renderTask);

    // the brigade now: roles and work come from the current task while it is active
    var cItems = !cActive ? [] : v && v.isCur ? items : (cur.items || []).filter(Boolean).map(itemOf);
    var work = {}, bad = {}, byItem = {};
    function w(n) { return work[n] || (work[n] = { doing: [], fixing: [], reviewing: [] }); }
    cItems.forEach(function (i) {
      if (i.st.col === "work" && i.assignee) w(i.assignee)[i.status === "claimed" ? "doing" : "fixing"].push(i.id);
      if (i.st.col === "review" || i.st.col === "work") i.reviewing.forEach(function (n) { w(n).reviewing.push(i.id); });
    });
    agents.forEach(function (a) { if (a.state === "gone") bad[a.name] = "ушёл"; else if (a.drop) bad[a.name] = "возможно выпал"; });
    runs.forEach(function (r) { if (r.item) (byItem[r.item] = byItem[r.item] || []).push([r.id, r.status]); });
    sec("agents", { agents: agents, lead: cActive ? cth.Lead || "" : "", work: work, pfx: cActive && v && !v.isCur ? curId : "", asking: asking, hasData: !!d, cs: cs, gpause: !!meta.pause }, renderAgents);
    if (CTL) {
      sec("ctl", { act: S.act, title: S.actTitle, pause: !!meta.pause, stop: !!meta.stop,
        canSpawn: !!(meta.spawn && Array.isArray(meta.spawn.supported) && meta.spawn.supported.length),
        halted: !!meta.pause || !!meta.stop || agents.some(function (a) { return a.paused || a.stopped; }) }, renderCtl);
      sec("composer", { names: agents.filter(function (a) { return a.state !== "gone"; }).map(function (a) { return a.name; })
        .concat((S.to || []).filter(function (n) { return !agents.some(function (a) { return a.name === n && a.state !== "gone"; }); })),
        to: S.to, re: S.re, act: S.act, tab: S.msgTab, sendChan: S.sendChan, cs: cs }, renderComposer);
    }
    sec("kanban", { items: items, runs: byItem, bad: isLive ? bad : {}, hasTask: !!t, tid: tid, live: isLive, closed: closed,
      closedAt: closed ? num(th["Closed-Epoch"]) : 0, cs: cs }, renderKanban);
    sec("runs", { runs: runs, hasTask: !!t, tid: tid, cs: cs }, renderRuns);

    var lobby = (d && d.lobby) || [], tmsgs = t ? t.messages || [] : [];
    var msgs = S.msgTab === "lobby" ? lobby : tmsgs, chan = S.msgTab === "lobby" ? "lobby" : tid;
    var seenNames = {};
    agents.forEach(function (a) { seenNames[a.name] = 1; });
    msgs.forEach(function (m) { var f = hv(m, "From"); if (f) seenNames[f] = 1; });
    var nm = Object.keys(seenNames).sort(natcmp);
    sec("msgctl", { tab: S.msgTab, tid: tid, nTask: tmsgs.length, nLobby: lobby.length, names: nm, agent: S.agent, hideSys: S.hideSys }, renderMsgCtl);
    var tr = S.msgTab === "lobby" ? (meta.trunc || {}).lobby : (v && v.trunc || {}).task;
    var expired = msgs.filter(function (m) { var rb = num(hv(m, "Reply-By")); return rb && now() >= rb; }).length;
    var first = S.msgChan !== chan;
    S.msgChan = chan;
    sec("msgs", { chan: chan, msgs: msgs, agent: S.agent, hideSys: S.hideSys, trunc: tr || null, expired: expired, first: first,
      canReply: CTL && (chan === "lobby" || (!!S.act && chan === S.act)),
      asks: hasAsks ? asks.map(function (q) { return q.chan + ":" + q.id; }) : null, cs: cs }, renderMsgs);

    sec("docs", { tab: S.docTab, hasTask: !!t, closed: closed, docs: t ? { brief: t.brief, plan: t.plan, summary: t.summary } : {} }, renderDocs);
    sec("tasks", { tasks: tasks, vid: tid, curId: curId }, renderTasks);
  }

  function tick() {
    var xs = document.querySelectorAll("[data-since]"), t = now(), i, e, s;
    for (i = 0; i < xs.length; i++) {
      e = xs[i];
      s = +e.getAttribute("data-since");
      e.textContent = e.getAttribute("data-fmt") === "ago" ? ago(t - s) : dur(t - s);
    }
  }

  function readHash() {
    var h = (location.hash || "").replace(/^#/, "");
    S.sel = /^T\d{3,6}$/.test(h) ? h : "";
  }
  if (CTL) {
    $("ctl").className = "ctl";
    $("cmpsend").addEventListener("click", sendMsg);
    $("cmptext").addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === "Enter" || e.keyCode === 13)) { e.preventDefault(); sendMsg(); }
    });
    $("cmptext").addEventListener("input", function () { if ($("cmpst").textContent) cmpStatus("", false); });
    $("cmpchan").addEventListener("change", function () { S.sendChan = this.value; });
    document.addEventListener("click", closeMenus);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" || e.keyCode === 27) { closeMenus(); closeModal(); }
    });
  }
  window.addEventListener("hashchange", function () { readHash(); render(); });
  $("tasksel").addEventListener("change", function () { location.hash = this.value; });
  $("magent").addEventListener("change", function () { S.agent = this.value; render(); });
  $("msys").addEventListener("change", function () { S.hideSys = this.checked; render(); });
  readHash();
  load();
  setInterval(load, REFRESH);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
